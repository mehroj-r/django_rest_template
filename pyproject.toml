[project]
name = "django-boilerplate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cookiecutter>=2.7.1",
    "jinja2-time>=0.2.0",
    "ruff>=0.15.13",
]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["{{cookiecutter.project_slug}}", "{{ cookiecutter.project_slug }}"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "DJ"]
ignore = [
    "E501", # Line too long
    "DJ001", # Avoid null=True on string-based fields
    "F403", # Star imports
    "F405", # Undefined names from star imports
    "B024", # Abstract base class without abstract methods
    "B904", # raise ... from err
]

[tool.ty.environment]
extra-paths = ["hooks"]

[tool.ty.src]
include = ["."]

